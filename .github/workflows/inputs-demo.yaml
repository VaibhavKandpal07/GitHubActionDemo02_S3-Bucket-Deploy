name: Inputs Demo
on: 
  workflow_dispatch:
   inputs: 
     environments:
       description: Choose the environment to deploy
       required: true
       default: dev
       type: choice
       options: 
        - dev
        - test
        - prod
     artifact_tags:
       description: Choose the git tag to deploy
       required: true
   

      jobs:
        inputs-demo:
        runs-on: ubuntu-latest
        steps:
        - name: Deploy the App
          run: echo "Deploying the ${{inputs.artifact_tags}} application to ${{ inputs.environment }}"
        
    #we are using single workflow for 3 different environment   
    
   
